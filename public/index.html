<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="/manifest.json">
<title>Qsign</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-dk:#1d4ed8;--blue-lt:#eff6ff;
  --green:#16a34a;--green-lt:#f0fdf4;
  --red:#dc2626;--red-lt:#fef2f2;
  --amber:#d97706;--amber-lt:#fffbeb;
  --bg:#f8fafc;--panel:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--faint:#cbd5e1;
  --radius:16px;--nav-h:64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;--panel:#1e293b;--border:#334155;
    --text:#f1f5f9;--muted:#94a3b8;--faint:#334155;
    --blue-lt:#1e3a5f;--green-lt:#052e16;--red-lt:#450a0a;--amber-lt:#451a03;
  }
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}

/* SCREEN SYSTEM */
.screen{display:none;flex-direction:column;min-height:100dvh}
.screen.active{display:flex}

/* LOGIN SCREEN */
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1.5rem;gap:2rem}
.brand{text-align:center}
.brand-icon{width:64px;height:64px;background:var(--blue);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;box-shadow:0 8px 24px rgba(37,99,235,.35)}
.brand-icon svg{width:32px;height:32px;fill:#fff}
.brand h1{font-size:1.75rem;font-weight:800;letter-spacing:-.03em}
.brand p{font-size:.875rem;color:var(--muted);margin-top:.25rem}
.login-form{width:100%;display:flex;flex-direction:column;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input{padding:.75rem 1rem;background:var(--panel);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none;transition:border-color .15s;-webkit-appearance:none}
.field input:focus{border-color:var(--blue)}
.btn{padding:.8rem;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;-webkit-appearance:none}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err-box{padding:.65rem .85rem;border-radius:8px;font-size:.82rem;color:var(--red);background:var(--red-lt);display:none}

/* TOP BAR */
.topbar{padding:calc(.85rem + var(--safe-top)) 1.25rem .85rem;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar-logo{font-size:1rem;font-weight:800;color:var(--blue);letter-spacing:-.02em}
.topbar-user{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}

/* MAIN CONTENT */
.main-scroll{flex:1;overflow-y:auto;padding:1.25rem 1.25rem calc(var(--nav-h) + var(--safe-bot) + 1rem);display:flex;flex-direction:column;gap:1rem}

/* CLOCK WIDGET */
.clock-widget{background:var(--blue);border-radius:var(--radius);padding:1.5rem 1.25rem 1.25rem;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(37,99,235,.3)}
.clock-time{font-size:3rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.clock-date{font-size:.875rem;opacity:.8;margin-top:.3rem}

/* LOCATION CHIP */
.location-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .85rem;border-radius:99px;font-size:.8rem;font-weight:700;margin-top:.9rem}
.chip-green{background:rgba(22,163,74,.25);color:#4ade80}
.chip-red{background:rgba(220,38,38,.25);color:#f87171}
.chip-amber{background:rgba(217,119,6,.25);color:#fcd34d}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-green{background:#4ade80}
.dot-red{background:#f87171}
.dot-amber{background:#fcd34d}

/* CLOCK BUTTON */
.clock-btn-wrap{display:flex;justify-content:center;margin-top:1rem}
.clock-btn{width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;font-size:.85rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;transition:transform .15s,box-shadow .15s;-webkit-appearance:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.clock-btn:hover:not(:disabled){transform:scale(1.04);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.clock-btn:active:not(:disabled){transform:scale(.97)}
.clock-btn:disabled{opacity:.45;cursor:not-allowed}
.clock-btn svg{width:32px;height:32px}
.btn-in{background:var(--green);color:#fff}
.btn-out{background:var(--red);color:#fff}

/* STATUS CARD */
.status-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem}
.sc-row{display:flex;align-items:center;justify-content:space-between;font-size:.85rem}
.sc-label{color:var(--muted);font-weight:600}
.sc-value{font-weight:700;font-variant-numeric:tabular-nums}
.sc-divider{height:1px;background:var(--border);margin:.75rem 0}
.sc-hours{font-size:1.5rem;font-weight:800;color:var(--blue)}

/* RECENT RECORDS */
.section-head{display:flex;align-items:baseline;justify-content:space-between}
.section-title{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section-link{font-size:.75rem;color:var(--blue);cursor:pointer}
.record-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:.9rem}
.rc-date{text-align:center;min-width:40px}
.rc-day{font-size:1.1rem;font-weight:800;line-height:1}
.rc-mon{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rc-body{flex:1}
.rc-times{font-size:.87rem;font-weight:700;font-variant-numeric:tabular-nums}
.rc-loc{font-size:.73rem;color:var(--muted);margin-top:.1rem}
.rc-hours{font-size:.87rem;font-weight:800;color:var(--blue);white-space:nowrap}
.rc-edited{font-size:.65rem;color:var(--amber);margin-top:.1rem}
.empty-records{text-align:center;padding:1.5rem;color:var(--muted);font-size:.82rem}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-bot));background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding:.6rem 0 var(--safe-bot);z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;padding:.1rem .9rem;border:none;background:none;color:var(--muted);font-size:.65rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;transition:color .15s;-webkit-appearance:none}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.on{color:var(--blue)}

/* HISTORY TAB */
.history-list{display:flex;flex-direction:column;gap:.6rem}

/* PROFILE TAB */
.profile-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center}
.profile-avatar{width:68px;height:68px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem}
.profile-name{font-size:1.1rem;font-weight:800}
.profile-meta{font-size:.82rem;color:var(--muted);margin-top:.2rem}
.logout-btn{width:100%;padding:.7rem;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--red);font-size:.9rem;font-weight:700;cursor:pointer;margin-top:1rem;transition:all .15s}
.logout-btn:hover{background:var(--red-lt)}

/* Loader */
.spinner{display:inline-block;width:20px;height:20px;border:2.5px solid var(--faint);border-top-color:var(--blue);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.loading-overlay.show{display:flex}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 5h2v6l-4.24 2.53-.76-1.32L11 12.2V7z"/></svg>
      </div>
      <h1>Qsign</h1>
      <p>Attendance & time management</p>
    </div>
    <div class="login-form">
      <div class="err-box" id="login-err"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@company.com" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-blue" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>
    <p style="font-size:.73rem;color:var(--muted);text-align:center">Don't have an account? Contact your administrator.</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="screen-app" class="screen">
  <div class="topbar">
    <span class="topbar-logo">Qsign</span>
    <div class="topbar-user">
      <span id="user-name-top"></span>
      <div class="avatar" id="user-avatar"></div>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="tab-home" class="main-scroll">
    <!-- Clock widget -->
    <div class="clock-widget">
      <div class="clock-time" id="live-clock">00:00:00</div>
      <div class="clock-date" id="live-date"></div>
      <div id="location-chip">
        <div class="location-chip chip-amber">
          <span class="chip-dot dot-amber"></span>
          <span id="loc-text">Getting location…</span>
        </div>
      </div>
    </div>

    <!-- Clock in/out button -->
    <div class="clock-btn-wrap">
      <button id="clock-btn" class="clock-btn btn-in" disabled onclick="doClock()">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 5h2v5.25l4.53 2.67-.99 1.68L11 13.5V7z"/></svg>
        <span id="clock-btn-label">CLOCK IN</span>
      </button>
    </div>

    <!-- Today's status card -->
    <div class="status-card" id="status-card" style="display:none">
      <div class="sc-row">
        <span class="sc-label">Clocked in</span>
        <span class="sc-value" id="sc-in-time">—</span>
      </div>
      <div class="sc-divider"></div>
      <div style="text-align:center">
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:.25rem">TODAY'S HOURS</div>
        <div class="sc-hours" id="sc-hours">0h 00m</div>
      </div>
    </div>

    <!-- Location error -->
    <div id="loc-error" style="display:none;padding:.75rem 1rem;background:var(--red-lt);border-radius:10px;font-size:.82rem;color:var(--red);line-height:1.5"></div>

    <!-- Recent -->
    <div class="section-head">
      <span class="section-title">Recent Shifts</span>
      <span class="section-link" onclick="showTab('history')">View all</span>
    </div>
    <div id="recent-list"></div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" class="main-scroll" style="display:none">
    <div class="section-title" style="margin-bottom:.5rem">All Shifts</div>
    <div class="history-list" id="history-list"></div>
    <div id="history-more" style="text-align:center;padding:.75rem;display:none">
      <button class="btn" style="background:var(--blue-lt);color:var(--blue);padding:.5rem 1.5rem;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;border:none" onclick="loadMoreHistory()">Load more</button>
    </div>
  </div>

  <!-- PROFILE TAB -->
  <div id="tab-profile" class="main-scroll" style="display:none">
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar"></div>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-meta" id="profile-meta"></div>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
    <div id="admin-link-wrap" style="display:none">
      <a href="/admin.html" style="display:block;text-align:center;padding:.7rem;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:.875rem;text-decoration:none;margin-top:.5rem">Open Admin Dashboard →</a>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item on" id="nav-home" onclick="showTab('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nav-item" id="nav-history" onclick="showTab('history')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
    <button class="nav-item" id="nav-profile" onclick="showTab('profile')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </nav>
</div>

<div class="loading-overlay" id="loader"><div class="spinner"></div></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let TOKEN      = localStorage.getItem('qs_token');
let USER       = JSON.parse(localStorage.getItem('qs_user') || 'null');
let gpsCoords  = null;
let gpsError   = null;
let clockedIn  = false;
let openRecord = null;
let histPage   = 1;
let histTotal  = 0;
let tickTimer  = null;
let gpsTimer   = null;

// ── Boot ──────────────────────────────────────────────────────────────────────
function boot() {
  if (TOKEN && USER) {
    showApp();
  } else {
    showScreen('login');
  }
  startClock();
}

function showApp() {
  showScreen('app');
  renderUserHeader();
  startGPS();
  loadStatus();
  loadRecent();
  if (USER?.role === 'admin') document.getElementById('admin-link-wrap').style.display = '';
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl    = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!email || !password) { showErr(errEl, 'Enter email and password'); return; }

  setLoading(true);
  try {
    const r = await api('POST', '/api/auth/login', { email, password }, false);
    TOKEN = r.token;
    USER  = r.user;
    localStorage.setItem('qs_token', TOKEN);
    localStorage.setItem('qs_user',  JSON.stringify(USER));
    showApp();
  } catch (e) {
    showErr(errEl, e.message || 'Login failed');
  } finally { setLoading(false); }
}

function doLogout() {
  TOKEN = null; USER = null;
  localStorage.removeItem('qs_token');
  localStorage.removeItem('qs_user');
  gpsCoords = null;
  clearInterval(gpsTimer);
  showScreen('login');
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function startClock() {
  function tick() {
    const now = new Date();
    document.getElementById('live-clock').textContent =
      now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    document.getElementById('live-date').textContent =
      now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    if (clockedIn && openRecord) updateLiveHours();
  }
  tick();
  setInterval(tick, 1000);
}

function updateLiveHours() {
  const ms = Date.now() - new Date(openRecord.check_in_time);
  document.getElementById('sc-hours').textContent = fmtDuration(ms);
}

// ── GPS ───────────────────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) {
    setLocChip('error', 'GPS not available on this device');
    return;
  }
  setLocChip('loading', 'Getting your location…');
  function doGet() {
    navigator.geolocation.getCurrentPosition(
      pos => {
        gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        gpsError  = null;
        checkGeofence();
      },
      err => {
        gpsError  = err.code === 1 ? 'Location permission denied — enable it in browser settings' : 'Could not get location';
        gpsCoords = null;
        setLocChip('error', gpsError);
        updateClockBtn();
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
  }
  doGet();
  gpsTimer = setInterval(doGet, 30000); // refresh every 30s
}

async function checkGeofence() {
  if (!gpsCoords) return;
  // Lightweight check: just update button state based on current clock status
  setLocChip('loading', 'Checking location…');
  try {
    // We'll verify server-side on action; here just show coords available
    setLocChip('ok', 'Location acquired');
    document.getElementById('loc-error').style.display = 'none';
  } catch {}
  updateClockBtn();
}

function setLocChip(type, text) {
  const chip = document.getElementById('location-chip');
  const cls  = type === 'ok' ? 'chip-green' : type === 'error' ? 'chip-red' : 'chip-amber';
  const dot  = type === 'ok' ? 'dot-green' : type === 'error' ? 'dot-red'  : 'dot-amber';
  chip.innerHTML = `<div class="location-chip ${cls}"><span class="chip-dot ${dot}"></span><span>${text}</span></div>`;
}

function updateClockBtn() {
  const btn   = document.getElementById('clock-btn');
  const label = document.getElementById('clock-btn-label');
  const hasGps = !!gpsCoords;

  if (clockedIn) {
    btn.className  = 'clock-btn btn-out';
    label.textContent = 'CLOCK OUT';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="white" width="32" height="32"><path d="M8 3a1 1 0 00-1 1v16a1 1 0 001 1h3V3H8zm5 0v18h3a1 1 0 001-1V4a1 1 0 00-1-1h-3z"/></svg><span>CLOCK OUT</span>`;
  } else {
    btn.className  = 'clock-btn btn-in';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="white" width="32" height="32"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 5h2v5.25l4.53 2.67-.99 1.68L11 13.5V7z"/></svg><span>CLOCK IN</span>`;
  }
  btn.disabled = !hasGps;
}

// ── Clock action ──────────────────────────────────────────────────────────────
async function doClock() {
  if (!gpsCoords) { alert('Location not available. Please allow location access.'); return; }
  const btn = document.getElementById('clock-btn');
  btn.disabled = true;
  const locErr = document.getElementById('loc-error');
  locErr.style.display = 'none';

  try {
    if (clockedIn) {
      const r = await api('POST', '/api/attendance/checkout', gpsCoords);
      clockedIn  = false;
      openRecord = null;
      document.getElementById('status-card').style.display = 'none';
      setLocChip('ok', `Clocked out — ${r.hoursWorked.toFixed(2)}h`);
      loadRecent();
    } else {
      const r = await api('POST', '/api/attendance/checkin', gpsCoords);
      clockedIn  = true;
      openRecord = r.record;
      setLocChip('ok', `At ${r.locationName}`);
      showStatusCard();
      loadRecent();
    }
  } catch (e) {
    if (e.distanceMeters) {
      locErr.innerHTML = `<strong>Outside work location</strong><br>You are ${e.distanceMeters}m from "${e.locationName}".<br>Move within ${e.radiusMeters}m to clock ${clockedIn ? 'out' : 'in'}.`;
      setLocChip('error', `${e.distanceMeters}m from ${e.locationName}`);
    } else {
      locErr.textContent = e.message || 'Action failed';
    }
    locErr.style.display = '';
  } finally {
    btn.disabled = false;
    updateClockBtn();
  }
}

// ── Status ────────────────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const r = await api('GET', '/api/attendance/status');
    clockedIn  = r.clocked_in;
    openRecord = r.record;
    if (clockedIn && openRecord) showStatusCard();
    else document.getElementById('status-card').style.display = 'none';
    updateClockBtn();
  } catch {}
}

function showStatusCard() {
  const card = document.getElementById('status-card');
  card.style.display = '';
  document.getElementById('sc-in-time').textContent =
    new Date(openRecord.check_in_time).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  updateLiveHours();
}

// ── Records ───────────────────────────────────────────────────────────────────
async function loadRecent() {
  try {
    const r = await api('GET', '/api/attendance/history?limit=5');
    const el = document.getElementById('recent-list');
    el.innerHTML = r.records.length
      ? r.records.map(renderRecordCard).join('')
      : '<div class="empty-records">No shifts recorded yet</div>';
  } catch {}
}

async function loadHistory(reset = false) {
  if (reset) { histPage = 1; document.getElementById('history-list').innerHTML = ''; }
  try {
    const r = await api('GET', `/api/attendance/history?page=${histPage}&limit=20`);
    histTotal = r.total;
    const el  = document.getElementById('history-list');
    el.insertAdjacentHTML('beforeend', r.records.map(renderRecordCard).join(''));
    document.getElementById('history-more').style.display =
      histPage * 20 < r.total ? '' : 'none';
  } catch {}
}

function loadMoreHistory() { histPage++; loadHistory(); }

function renderRecordCard(r) {
  const d   = new Date(r.check_in_time);
  const day = d.getDate();
  const mon = d.toLocaleDateString('en-GB', { month:'short' });
  const cin = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  const cout = r.check_out_time
    ? new Date(r.check_out_time).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
    : '—';
  const hrs  = r.check_out_time ? fmtHours(r.hours_worked) : '<span style="color:var(--green)">Active</span>';
  const edited = r.edited_at ? '<div class="rc-edited">✏ Edited by admin</div>' : '';
  return `<div class="record-card">
    <div class="rc-date"><div class="rc-day">${day}</div><div class="rc-mon">${mon}</div></div>
    <div class="rc-body">
      <div class="rc-times">${cin} → ${cout}</div>
      <div class="rc-loc">${r.location_name || 'Work location'}</div>
      ${edited}
    </div>
    <div class="rc-hours">${hrs}</div>
  </div>`;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showTab(tab) {
  ['home','history','profile'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display    = t === tab ? 'flex' : 'none';
    document.getElementById(`nav-${t}`).classList.toggle('on', t === tab);
  });
  if (tab === 'history') loadHistory(true);
  if (tab === 'profile') renderProfile();
}

function renderUserHeader() {
  document.getElementById('user-name-top').textContent = USER?.name?.split(' ')[0] || '';
  document.getElementById('user-avatar').textContent   = initials(USER?.name || '?');
}

function renderProfile() {
  document.getElementById('profile-avatar').textContent = initials(USER?.name || '?');
  document.getElementById('profile-name').textContent   = USER?.name || '';
  document.getElementById('profile-meta').textContent   =
    [USER?.department, USER?.email].filter(Boolean).join(' · ');
}

// ── Screen switcher ───────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${id}`).classList.add('active');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
async function api(method, path, body, auth = true) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(auth && TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {}) },
    ...(body ? { body: JSON.stringify(body) } : {}),
  };
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) { const e = new Error(d.error || r.status); Object.assign(e, d); throw e; }
  return d;
}

function setLoading(on) { document.getElementById('loader').classList.toggle('show', on); }
function showErr(el, msg) { el.textContent = msg; el.style.display = ''; }
function initials(name) { return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmtDuration(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return `${h}h ${String(m).padStart(2,'0')}m`;
}
function fmtHours(h) {
  if (!h) return '—';
  const hrs = Math.floor(h);
  const min = Math.round((h - hrs) * 60);
  return `${hrs}h ${String(min).padStart(2,'0')}m`;
}

boot();
</script>
</body>
</html>
