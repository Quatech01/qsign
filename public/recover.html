<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qsign — Account Recovery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f5f9;--panel:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--faint:#f8fafc;--blue:#2563eb}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--faint:#0f172a}
}
:root[data-theme="dark"]{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--faint:#0f172a}
:root[data-theme="light"]{--bg:#f1f5f9;--panel:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--faint:#f8fafc}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--panel);border-radius:16px;padding:2rem;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:.25rem}
p.sub{font-size:.82rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.5}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:.72rem 1rem;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;margin-bottom:.85rem;outline:none;transition:border-color .15s;color:var(--text);background:var(--panel)}
input:focus{border-color:var(--blue)}
button{width:100%;padding:.82rem;border-radius:12px;border:none;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .15s;margin-bottom:.6rem}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:var(--panel);color:var(--text);border:1.5px solid var(--border)}
.msg{padding:.75rem 1rem;border-radius:8px;font-size:.82rem;display:none;line-height:1.5;margin-top:.5rem}
.msg.ok{background:#f0fdf4;color:#16a34a}
.msg.err{background:#fef2f2;color:#dc2626}
.result-row{background:var(--faint);border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;margin-bottom:.4rem;font-size:.82rem}
.result-row strong{display:block;font-weight:700;color:var(--text)}
.result-row span{color:var(--muted)}
hr{border:none;border-top:1px solid var(--border);margin:1.25rem 0}
.theme-btn{position:fixed;top:1rem;right:1rem;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:99;padding:0;transition:background .15s}
.theme-btn:hover{background:var(--faint)}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme"></button>
<div class="card">
  <h1>Account Recovery</h1>
  <p class="sub">Use your setup key to look up companies and reset admin passwords.</p>

  <label>Setup Key</label>
  <input id="setup-key" type="text" placeholder="Paste your setup key">

  <button class="btn-outline" onclick="listCompanies()">Step 1 — Show My Companies</button>
  <div id="companies-result"></div>

  <hr>

  <label>Company Code</label>
  <input id="company-code" type="text" placeholder="e.g. UNILIV" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
  <label>New Password</label>
  <input id="new-password" type="password" placeholder="Min 6 characters">

  <button class="btn-blue" onclick="resetPassword()">Step 2 — Reset Admin Password</button>
  <div class="msg" id="msg"></div>

  <hr style="margin-top:.75rem">
  <p style="font-size:.72rem;color:#94a3b8;text-align:center">After resetting, <a href="/admin.html" style="color:#2563eb">go to admin login →</a></p>
</div>
<script>
async function listCompanies() {
  const setup_key = document.getElementById('setup-key').value.trim();
  if (!setup_key) { alert('Enter your setup key first'); return; }
  const el = document.getElementById('companies-result');
  el.innerHTML = '<p style="font-size:.8rem;color:#64748b;margin-top:.5rem">Loading…</p>';
  try {
    const r = await fetch('/api/companies/list', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ setup_key })
    });
    const d = await r.json();
    if (!r.ok) { el.innerHTML = `<p style="color:#dc2626;font-size:.82rem;margin-top:.5rem">${d.error}</p>`; return; }
    if (!d.length) { el.innerHTML = '<p style="font-size:.82rem;color:#64748b;margin-top:.5rem">No companies found.</p>'; return; }
    el.innerHTML = '<p style="font-size:.72rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin:.75rem 0 .4rem">Your companies:</p>' +
      d.map(c => `<div class="result-row">
        <strong>${c.name} <span style="font-family:monospace;background:#eff6ff;color:#2563eb;padding:.1rem .35rem;border-radius:4px;font-size:.78rem">${c.company_code}</span></strong>
        <span>Admin: ${c.admin_name || '—'} (${c.admin_email || '—'})</span>
      </div>`).join('');
  } catch { el.innerHTML = '<p style="color:#dc2626;font-size:.82rem;margin-top:.5rem">Network error</p>'; }
}

async function resetPassword() {
  const setup_key    = document.getElementById('setup-key').value.trim();
  const company_code = document.getElementById('company-code').value.trim();
  const new_password = document.getElementById('new-password').value;
  const msg = document.getElementById('msg');
  msg.style.display = 'none';
  if (!setup_key || !company_code || !new_password) { show('All fields required', false); return; }
  try {
    const r = await fetch('/api/admin-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ setup_key, company_code, new_password })
    });
    const d = await r.json();
    if (r.ok) show(`Password reset for: ${d.admins.map(u => u.email).join(', ')}. You can now log in.`, true);
    else show(d.error || 'Reset failed', false);
  } catch { show('Network error', false); }
}

function show(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}
</script>
<script>
(function(){
  var saved=localStorage.getItem('qsign-theme');
  if(saved) document.documentElement.setAttribute('data-theme',saved);
  function isDark(){var t=document.documentElement.getAttribute('data-theme');return t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches);}
  function updateBtn(){document.querySelectorAll('.theme-btn').forEach(function(b){b.innerHTML=isDark()?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';});}
  window.toggleTheme=function(){var next=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('qsign-theme',next);updateBtn();};
  document.addEventListener('DOMContentLoaded',updateBtn);updateBtn();
})();
</script>
</body>
</html>
