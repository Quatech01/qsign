<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qsign — Admin Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{font-size:1.25rem;font-weight:800;color:#0f172a;margin-bottom:.25rem}
p{font-size:.85rem;color:#64748b;margin-bottom:1.5rem}
label{display:block;font-size:.8rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
input{width:100%;padding:.75rem 1rem;border:1.5px solid #e2e8f0;border-radius:10px;font-size:1rem;margin-bottom:1rem;outline:none;transition:border-color .15s}
input:focus{border-color:#2563eb}
button{width:100%;padding:.85rem;background:#2563eb;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:1rem;padding:.75rem 1rem;border-radius:8px;font-size:.85rem;display:none}
.msg.ok{background:#f0fdf4;color:#16a34a}
.msg.err{background:#fef2f2;color:#dc2626}
</style>
</head>
<body>
<div class="card">
  <h1>Qsign Admin Setup</h1>
  <p>Create the first admin account. This page stops working once an admin exists.</p>
  <label>Full Name</label>
  <input id="name" type="text" placeholder="e.g. Uche Odoemelam">
  <label>Email</label>
  <input id="email" type="email" placeholder="admin@example.com">
  <label>Password</label>
  <input id="password" type="password" placeholder="Min 6 characters">
  <label>Setup Key</label>
  <input id="key" type="text" placeholder="Paste the setup key">
  <button id="btn" onclick="setup()">Create Admin Account</button>
  <div class="msg" id="msg"></div>
</div>
<script>
async function setup() {
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const setup_key = document.getElementById('key').value.trim();
  if (!name || !email || !password || !setup_key) {
    show('All fields are required', false); return;
  }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, setup_key })
    });
    const d = await r.json();
    if (r.ok) {
      show('Admin account created! You can now log in at the main app.', true);
      btn.textContent = 'Done ✓';
    } else {
      show(d.error || 'Setup failed', false);
      btn.disabled = false; btn.textContent = 'Create Admin Account';
    }
  } catch {
    show('Network error — is the server up?', false);
    btn.disabled = false; btn.textContent = 'Create Admin Account';
  }
}
function show(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}
</script>
</body>
</html>
