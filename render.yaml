services:
  - type: web
    name: qsign
    runtime: node
    buildCommand: npm install
    startCommand: node lib/migrate.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: SETUP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qsign-db
          property: connectionString

databases:
  - name: qsign-db
    plan: free
